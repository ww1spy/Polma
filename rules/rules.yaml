# ============================================================
# Polma trading rules
# ============================================================
# This file IS the strategy. Edit it, commit it, and the next
# trading cycle picks it up. Bump `version` + `updated` on every
# meaningful change so journal entries trace to exact rules.
#
# Hard risk guardrails live in config/risk_limits.yaml and
# ALWAYS override anything written here.
# ============================================================

version: 7
updated: "2026-07-08"
# v7 = v6 (validated v4 parameters) + kalshi sizing floor: at the current
# small live bankroll, 2% per trade is less than ONE contract in the
# 0.90-0.97 band, so kalshi sizes at 2.5% — the smallest real position.
# Post-challenge history: journal/challenge-2026-07-08.md + LAD post-mortem.
notes: >
  v4: Kalshi strategy calibrated from its own backtests (journal/backtests/,
  grid over ~300 settled markets, fees modeled). Kalshi findings: (1) golf
  finish-position props (KXPGA*) lose consistently — excluded; (2) the edge
  lives in SHORT horizons (2h-3d to resolution: +3.5% ROI, 98% win rate) and
  disappears at the 12h-10d horizon that works on Polymarket; (3) the 0.90-0.97
  band beats 0.85-0.96 here; (4) stops must trigger off the ASK, not the bid —
  Kalshi books thin out and a collapsed bid alone phantom-fired stops in every
  backtest configuration. Polymarket base rules unchanged from v2 evidence
  (+2.2% ROI over 600 markets). Known residual risk: correlated positions
  (several markets on one event) — watch manually until a correlation guard
  is coded.

# ---- Which markets are even considered ----
universe:
  min_liquidity_usd: 50000        # backtest: quality filter is the edge — trade only busy books
  min_volume_24h_usd: 50000
  min_hours_to_resolution: 12     # no in-play sports; live games gap violently
  max_days_to_resolution: 10      # fast capital velocity → more settle events → faster learning
  exclude_question_keywords: []

# Venue-specific overrides (merged over universe/strategy/exits at load).
# Kalshi runs smaller, charges taker fees, and its profitable pocket is
# short-horizon — all calibrated from Kalshi's own backtests, not assumed.
venue_overrides:
  kalshi:
    universe:
      min_liquidity_usd: 10000    # open-interest proxy, ~$1/contract
      min_volume_24h_usd: 5000
      min_hours_to_resolution: 2
      max_days_to_resolution: 3   # the edge decays fast with horizon here
      exclude_ticker_prefixes:
        - KXPGA                   # golf finish props: consistent loser in backtests
        # Crypto strike/range ladders: negative EV in intraday backtests.
        # Blanket prefixes — a sibling family (KXBTC- ranges) leaked through
        # narrower ones during the challenge. KXETH15M stays allowed (positive
        # in all backtest configs).
        - KXBTC
        - KXSOL
        - KXETHD
        - KXETH-
    strategy:
      min_price: 0.90             # 0.90-0.97 band beat 0.85-0.96 on Kalshi
      max_price: 0.97
    sizing:
      # 1-contract minimum: 2% of a small bankroll can't buy a 0.90+ contract
      bankroll_fraction_per_trade: 0.025

# ---- Entry strategies ----
strategies:
  - name: favorite_discount
    enabled: true
    description: >
      Buy the favored outcome at 85-96c in high-volume markets and hold
      to resolution. Backtest: this band beat 0.90+ and 0.96+ bands.
    min_price: 0.85
    max_price: 0.96
    max_spread: 0.02

# ---- Exit rules ----
exits:
  hold_to_resolution: true
  take_profit_bid: 0.99           # free capital early once outcome is near-certain
  # DISASTER stop only: fires when the favorite has fully flipped to
  # underdog (entry 0.90 → trigger ~0.35). Backtests showed tighter stops
  # (0.10, 0.25) lose money in every configuration — do not tighten this
  # without new backtest evidence.
  stop_loss_points: 0.55

# ---- Position sizing ----
sizing:
  bankroll_fraction_per_trade: 0.02
  max_notional_per_trade_usd: 15.0
  max_new_positions_per_cycle: 3
