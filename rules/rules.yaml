# ============================================================
# Polma trading rules
# ============================================================
# This file IS the strategy. Edit it, commit it, and the next
# trading cycle picks it up. Bump `version` + `updated` on every
# meaningful change so journal entries trace to exact rules.
#
# Hard risk guardrails live in config/risk_limits.yaml and
# ALWAYS override anything written here.
# ============================================================

version: 12
updated: "2026-07-09"
# v12: kalshi sizing 2.5% -> 5% (owner-approved 2026-07-09, "sizing change
# 1"). Monte Carlo over the live families' 60-day trade data: 5% roughly
# doubles median 30-day growth (+16.6% -> +35.5%) at P(halt) ~= 0.2% with
# the 15% drawdown halt UNCHANGED. 5% is exactly the hard cap in
# config/risk_limits.yaml — the hard limits did not move. Going past 5%
# requires live confirmation first (25 settled live trades, <=2 losses)
# AND a separate owner decision. Evidence: journal/backtests/sizing-mc-2026-07-09.md
# v11: RT "last-mile" strategy (owner-approved for paper AND live). An RT
# threshold market's outcome is often publicly decided (score posted) hours
# before Kalshi settles it, so 0.97-0.995 entries collect a settlement-lag
# premium on a decided fact: 119/119 wins, +1.86% ROI after fees over 60d,
# halves +1.96%/+1.77%. The same trade LOSES in WT20/WTI/ETH15M (they can
# still flip late) — so it is scoped to KXRT- only, NOT a band extension.
# Holds to settlement (per-strategy tp override; global 0.98 tp would close
# a 0.98 entry instantly). Kalshi now carries its own strategies list.
# Evidence: journal/backtests/structure-study-2026-07-09.md
# v10: OUT-OF-SAMPLE portfolio test (May 1-31, $500, v9 rules) LOST 13.4%
# and tripped the halt — WTI (-$45) and MLB (-$31) failed OOS; only
# Rotten Tomatoes (+$8.6) and Trump-mention (+$0.4) held up. Live now
# trades ONLY families positive in BOTH periods. Demoted families keep
# being measured in the aggr paper book.
# Evidence: journal/backtests/oos-may-2026-07-08.md
# v8: 4-week study (journal/backtests/hypotheses-4wk-2026-07-08.md) showed
# the pooled kalshi favorite edge is NEGATIVE (-4.1%, n=4272) and that
# naive family-picking fails out-of-sample. Kalshi universe is now an
# INCLUDE-LIST of mechanism-backed families positive in both half-periods;
# take-profit 0.99 -> 0.98 (same ROI, 3h faster capital recycling).
# History: v7 sizing floor; challenge post-mortems in journal/.
notes: >
  v4: Kalshi strategy calibrated from its own backtests (journal/backtests/,
  grid over ~300 settled markets, fees modeled). Kalshi findings: (1) golf
  finish-position props (KXPGA*) lose consistently — excluded; (2) the edge
  lives in SHORT horizons (2h-3d to resolution: +3.5% ROI, 98% win rate) and
  disappears at the 12h-10d horizon that works on Polymarket; (3) the 0.90-0.97
  band beats 0.85-0.96 here; (4) stops must trigger off the ASK, not the bid —
  Kalshi books thin out and a collapsed bid alone phantom-fired stops in every
  backtest configuration. Polymarket base rules unchanged from v2 evidence
  (+2.2% ROI over 600 markets). Known residual risk: correlated positions
  (several markets on one event) — watch manually until a correlation guard
  is coded.

# ---- Which markets are even considered ----
universe:
  min_liquidity_usd: 50000        # backtest: quality filter is the edge — trade only busy books
  min_volume_24h_usd: 50000
  min_hours_to_resolution: 12     # no in-play sports; live games gap violently
  max_days_to_resolution: 10      # fast capital velocity → more settle events → faster learning
  exclude_question_keywords: []

# Venue-specific overrides (merged over universe/strategy/exits at load).
# Kalshi runs smaller, charges taker fees, and its profitable pocket is
# short-horizon — all calibrated from Kalshi's own backtests, not assumed.
venue_overrides:
  kalshi:
    universe:
      # v9: thresholds aligned to what the 4-week backtest actually measured
      # (volume >= $2000; the include-list now does the quality filtering,
      # and 1-contract sizing needs no depth). The old 10k OI floor was
      # rejecting in-band trades in validated families (e.g. WTI strikes).
      min_liquidity_usd: 2000
      min_volume_24h_usd: 1000
      min_hours_to_resolution: 2
      max_days_to_resolution: 3   # the edge decays fast with horizon here
      # 4-week evidence: trade ONLY mechanism-backed families that were
      # positive in both half-periods (n>=30). Everything else measured
      # negative or unstable out-of-sample.
      include_ticker_prefixes:
        # Only families positive BOTH Jun-Jul (selection) AND May (OOS):
        - KXRT-                   # Rotten Tomatoes: +5.5% in-sample, +$8.64 May OOS, 100% win
        - KXTRUMPSAY              # NO-side of mention markets: +1.7% / +$0.42 OOS
        - KXWT20MATCH             # +3.8% in-sample; May OOS small sample, kept provisionally
        # DEMOTED to aggr paper book after May OOS test (v10):
        #   KXMLBGAME (-$30.92 May), KXWTI- (-$44.91 May), KXFIBAGAME (no OOS data)
    # v11: full strategy list for Kalshi (replaces the base list at load).
    strategies:
      - name: favorite_discount
        enabled: true
        description: >
          Buy the favored outcome at 90-97c and hold to resolution.
          0.90-0.97 band beat 0.85-0.96 on Kalshi (v4 backtests).
        min_price: 0.90
        max_price: 0.97
        max_spread: 0.02
      - name: rt_last_mile
        enabled: true
        description: >
          KXRT- only: buy 0.97-0.995 favorites in the final approach. The RT
          score is usually already published — this collects the settlement
          lag, not a prediction. 119/119 wins, +1.86% ROI, both halves
          positive (structure-study-2026-07-09). Holds to settlement.
        include_ticker_prefixes: [KXRT-]
        min_price: 0.97
        max_price: 0.995
        max_spread: 0.02
        take_profit_bid: 1.01     # unreachable — hold to settlement
    sizing:
      # v12: 5% per trade (owner-approved; MC-backed — see version note).
      # Sits exactly at the hard cap; risk.max_notional still applies the
      # floor-aware cap so no single loss can breach the drawdown floor.
      bankroll_fraction_per_trade: 0.05

# ---- Entry strategies ----
strategies:
  - name: favorite_discount
    enabled: true
    description: >
      Buy the favored outcome at 85-96c in high-volume markets and hold
      to resolution. Backtest: this band beat 0.90+ and 0.96+ bands.
    min_price: 0.85
    max_price: 0.96
    max_spread: 0.02

# ---- Exit rules ----
exits:
  hold_to_resolution: true
  take_profit_bid: 0.98           # H8 (4wk): same ROI as 0.99, ~3h faster recycling
  # DISASTER stop only: fires when the favorite has fully flipped to
  # underdog (entry 0.90 → trigger ~0.35). Backtests showed tighter stops
  # (0.10, 0.25) lose money in every configuration — do not tighten this
  # without new backtest evidence.
  stop_loss_points: 0.55

# ---- Position sizing ----
sizing:
  bankroll_fraction_per_trade: 0.02
  max_notional_per_trade_usd: 15.0
  max_new_positions_per_cycle: 3
