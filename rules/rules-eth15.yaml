# ============================================================
# EXPERIMENTAL profile "eth15" — PAPER ONLY. Tests H3 at live fidelity:
# the ETH 15-minute family is the ONE crypto family with a persistent
# measured edge (+2.3% ROI, 95.4% win, n=456 over 7 days; BTC and SOL
# controls at/below breakeven in the same band and window — see
# journal/backtests/hypotheses-2026-07-08.md).
#
# Run: POLMA_PROFILE=eth15 POLMA_RULES=rules/rules-eth15.yaml \
#      POLMA_LIMITS=config/risk_limits_aggressive.yaml \
#      POLMA_VENUE=kalshi python3 -m polma.cycle
#
# Caveats: single 7-day low-volatility crypto regime; hourly paper cadence
# samples ~1 of 4 windows per hour, so paper n grows slowly — the paper
# book's job is fill-fidelity confirmation, not statistical power.
# ============================================================

version: 2
updated: "2026-07-13"
# v2: PAUSED by weekly revalidation (journal/revalidations/2026-07-13.md).
# The edge decayed to DEMOTE: 7-day 1-min study -0.98% ROI with BOTH halves
# negative, statistically indistinguishable from the BTC control (-1.05%) —
# the original +2.3% was a regime artifact, exactly what the control was
# for. Paper record while it ran: 4-for-4, +$8.05. Strategy disabled
# (cycles stay runnable: settles/exits would still process). Re-enabling
# requires a fresh two-period-positive study vs control + owner sign-off.
notes: ETH15M-only fast-favorite profile (H3), paper-only. PAUSED v2.

universe:
  min_liquidity_usd: 2000
  min_volume_24h_usd: 300
  min_hours_to_resolution: 0.05    # entries 3-12 min pre-settle
  max_days_to_resolution: 0.01     # ~15 min horizon
  include_ticker_prefixes:
    - KXETH15M

strategies:
  - name: eth15_favorite
    enabled: false               # v2: paused — see version note
    description: Backtested 0.90-0.97 band, 3-12 min pre-settle, hold to settle.
    min_price: 0.90
    max_price: 0.97
    max_spread: 0.03

exits:
  hold_to_resolution: true
  take_profit_bid: 0.99
  stop_loss_points: 0.55

sizing:
  bankroll_fraction_per_trade: 0.05
  max_notional_per_trade_usd: 25.0
  max_new_positions_per_cycle: 1
