# ============================================================
# Polma — "maker" PAPER profile (Kalshi only, never live)
# ============================================================
# Run:  POLMA_VENUE=kalshi POLMA_PROFILE=maker POLMA_RULES=rules/rules-maker.yaml
#       POLMA_LIMITS=config/risk_limits_aggressive.yaml python3 -m polma.cycle
#
# Question this book answers: does the favorite strategy have an edge
# once we STOP paying the spread? Every book so far crossed the spread
# and landed below its break-even win rate (journal/scorecard.md,
# 2026-09-28). The 60-day revalidation now simulates both executions; on
# KXWT20MATCH the maker version earned +6.00% vs +4.16% taker, with an
# 80% simulated fill rate (journal/revalidations/2026-09-28-custom.md).
# Backtest fills come from candle prints; this book checks them against
# the live trade tape, forward, before any live consideration.
#
# Same candidate rules as the live Kalshi book (v14 band, horizon,
# exits) so the two are directly comparable; the universe is the full
# weekly watchlist so the sample grows ~10x faster than live's one family.
# The engine refuses execution: maker in live mode or on Polymarket.
# ============================================================

version: 1
updated: "2026-09-28"
# v1: created (owner decision 2026-09-28: "test limit-order entries in paper").
execution: maker

notes: >
  Orders rest one tick inside the spread (or join the bid when the spread
  is one tick), expire at the entry cutoff or after 24h, and fill ONLY on
  volume that printed through the order price after placement — see
  polma/maker.py. Maker fees follow each series' fee_type (0 on
  "quadratic" series).

universe:
  min_liquidity_usd: 2000
  min_volume_24h_usd: 1000
  min_hours_to_resolution: 2
  max_days_to_resolution: 3
  exclude_question_keywords: []
  include_ticker_prefixes:
    - KXWT20MATCH-
    - KXMLBGAME-
    - KXWNBAGAME-
    - KXFIBAGAME-
    - KXWTI-
    - KXRT-
    - KXTRUMPSAY-

strategies:
  - name: favorite_discount_maker
    enabled: true
    description: Rest a bid on the 0.90-0.97 favorite; hold to resolution.
    min_price: 0.90
    max_price: 0.97
    max_spread: 0.02

exits:
  hold_to_resolution: true
  take_profit_bid: 0.98
  stop_loss_points: 0.55

sizing:
  bankroll_fraction_per_trade: 0.02
  max_notional_per_trade_usd: 15.0
  max_new_positions_per_cycle: 3
